
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | TRICIAS BEAUTY CONNER</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8f4ef;
      font-family: Arial, sans-serif;
    }
    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 12px;
    }
    .reset-card input {
      width: 100%;
      padding: 13px;
      margin: 10px 0 18px;
    }
    .reset-card button {
      width: 100%;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Choose a new password</h1>
    <p>Enter your new admin password below.</p>

    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password"
        minlength="8" autocomplete="new-password" required>

      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password"
        minlength="8" autocomplete="new-password" required>

      <button type="submit">SAVE NEW PASSWORD</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="admin.html">Return to admin login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.TBC_CONFIG || {};
    const db = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_ANON_KEY
    );

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");

    db.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        message.textContent = "Enter your new password.";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (password !== confirm) {
        message.textContent = "The passwords do not match.";
        return;
      }

      const { error } = await db.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Password updated successfully. You can now log in.";
      form.hidden = true;
    });
  </script>
</body>
</html>
