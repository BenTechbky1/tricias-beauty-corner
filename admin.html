
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner dashboard | TRICIAS BEAUTY CONNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<!-- LOGIN -->
<section id="login-view" class="login">
  <form id="login-form" class="login-card">
    <p class="eyebrow">Private area</p>
    <h1>TRICIAS BEAUTY CONNER</h1>
    <p class="small">Owner login</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>

    <p id="login-error" class="form-message" hidden></p>

    <button class="btn" type="submit">LOG IN</button>

    <p class="small">
      <a href="#" id="forgot-password">Forgot your password?</a>
    </p>

    <p class="small">
      <a href="index.html">&larr; Back to website</a>
    </p>
  </form>
</section>

<!-- DASHBOARD -->
<div id="dash-view" hidden>
  <header class="dash-header">
    <div>
      <p class="eyebrow">Owner dashboard</p>
      <h1>TRICIAS BEAUTY CONNER</h1>
    </div>
    <div class="dash-actions">
      <button class="btn btn-outline btn-small" id="refresh-btn" type="button">Refresh</button>
      <button class="btn btn-outline btn-small" id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <main class="dash container">
    <div id="toast" class="toast" role="status" hidden></div>

    <nav class="tabs" id="tabs" aria-label="Filter appointments">
      <button data-filter="pending" class="active" type="button">Pending <span id="count-pending">0</span></button>
      <button data-filter="confirmed" type="button">Confirmed</button>
      <button data-filter="declined" type="button">Declined</button>
      <button data-filter="all" type="button">All</button>
      <button data-filter="settings" type="button">Working hours</button>
    </nav>

    <section id="list-view">
      <div id="bookings" class="bookings"></div>
    </section>

    <section id="settings-view" hidden>
      <form id="settings-form" class="booking-form settings-form">
        <div class="field">
          <label for="open_time">Opening time</label>
          <input id="open_time" type="time" required>
        </div>

        <div class="field">
          <label for="close_time">Closing time</label>
          <input id="close_time" type="time" required>
        </div>

        <div class="field">
          <label for="slot_minutes">Appointment duration (minutes)</label>
          <input id="slot_minutes" type="number" min="15" max="600" step="15" required>
        </div>

        <div class="field">
          <label for="max_days">How many days ahead customers can book</label>
          <input id="max_days" type="number" min="1" max="365" required>
        </div>

        <fieldset class="field field-wide days">
          <legend class="label">Working days</legend>
          <label><input type="checkbox" name="day" value="1"> Mon</label>
          <label><input type="checkbox" name="day" value="2"> Tue</label>
          <label><input type="checkbox" name="day" value="3"> Wed</label>
          <label><input type="checkbox" name="day" value="4"> Thu</label>
          <label><input type="checkbox" name="day" value="5"> Fri</label>
          <label><input type="checkbox" name="day" value="6"> Sat</label>
          <label><input type="checkbox" name="day" value="7"> Sun</label>
        </fieldset>

        <p class="small field-wide">
          Already confirmed appointments keep their original length. Changes apply to new availability only.
        </p>

        <button class="btn field-wide" type="submit">SAVE WORKING HOURS</button>
      </form>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
